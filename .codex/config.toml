# Codex 的專案層設定。
#
# 你不需要改這個檔案。第一次用 Codex 開啟這個資料夾時，它會問
# 「要不要信任這個目錄」——選信任之後，這份設定就會生效
# （Codex 只對受信任的專案載入專案層設定，這是它的安全機制）。
#
# 生效之後，你可以直接對 AI 說「列出我的專案」，它會用工具查，
# 不必自己在終端機打指令。
#
# 路徑寫成相對的，所以搬移資料夾也不用改。萬一 Codex 找不到，
# 把 args 改成絕對路徑即可，例如：
#   args = ["E:/你的路徑/ai-project-hub/bin/hub-mcp.mjs"]

[mcp_servers.ai-project-hub]
command = "node"
args = ["bin/hub-mcp.mjs"]
